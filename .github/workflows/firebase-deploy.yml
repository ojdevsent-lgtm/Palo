name: Deploy Palo Firebase Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'firebase/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        working-directory: firebase/functions
        run: npm install

      - name: Deploy Firebase database and functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --config firebase/firebase.json --project palo-vx --only database,functions --token "$FIREBASE_TOKEN"
